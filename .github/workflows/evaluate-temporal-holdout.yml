name: evaluate-temporal-holdout

on:
  push:
    branches: [research/rich-persona-signal]
    paths:
      - scripts/assemble_temporal_responses.py
      - scripts/evaluate_temporal_holdout.py
      - outputs/research/rich_persona_signal/temporal_holdout/rich_responses_*.jsonl
      - .github/workflows/evaluate-temporal-holdout.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/rich-persona-signal
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install analysis dependencies
        run: pip install numpy pandas scipy
      - name: Assemble frozen responses
        run: python scripts/assemble_temporal_responses.py
      - name: Evaluate future H&M demand
        run: python scripts/evaluate_temporal_holdout.py
      - name: Show report
        run: cat outputs/research/rich_persona_signal/temporal_holdout/REPORT.md
      - name: Persist experimental record
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/research/rich_persona_signal/temporal_holdout
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Record temporal H&M demand pilot"
            git push origin HEAD:research/rich-persona-signal
          fi

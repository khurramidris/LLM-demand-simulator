name: evaluate-learned-utility-v1
on:
  push:
    branches: [research/learned-utility-v1]
    paths:
      - 'scripts/evaluate_learned_utility_v1.py'
      - 'outputs/research/learned_utility_v1/provider_choices.csv'
      - '.github/workflows/evaluate-learned-utility-v1.yml'
jobs:
  evaluate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas scipy
      - name: Evaluate future H&M demand
        run: python scripts/evaluate_learned_utility_v1.py
      - name: Show report
        run: cat outputs/research/learned_utility_v1/REPORT.md
      - name: Persist results
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add outputs/research/learned_utility_v1/result.json outputs/research/learned_utility_v1/REPORT.md outputs/research/learned_utility_v1/utility_fits.jsonl
          git diff --cached --quiet || git commit -m 'Record learned utility benchmark result'
          git push

name: research-nb-zero-limit

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/research_nb_zero_limit.py"
      - ".github/workflows/research-nb-zero-limit.yml"
  workflow_dispatch:

jobs:
  nb-zero-limit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            numpy==2.2.6 \
            pandas==2.2.3 \
            scipy==1.15.3

      - name: Syntax check
        run: python -m py_compile scripts/research_nb_zero_limit.py

      - name: Run NB zero-dispersion limit diagnostic
        run: |
          python scripts/research_nb_zero_limit.py --n-splits 10

      - name: Print diagnostic
        if: always()
        run: |
          if [ -f outputs/research/nb_zero_limit/nb_lower_bound_summary.csv ]; then
            cat outputs/research/nb_zero_limit/nb_lower_bound_summary.csv
          fi
          if [ -f outputs/research/nb_zero_limit/logseries_summary.csv ]; then
            cat outputs/research/nb_zero_limit/logseries_summary.csv
          fi
          if [ -f outputs/research/nb_zero_limit/decision.json ]; then
            cat outputs/research/nb_zero_limit/decision.json
          fi

      - name: Upload diagnostic outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nb-zero-limit-results
          path: outputs/research/nb_zero_limit/
          if-no-files-found: warn

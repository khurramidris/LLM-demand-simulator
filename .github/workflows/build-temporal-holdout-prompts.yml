name: build-temporal-holdout-prompts

on:
  push:
    branches: [research/rich-persona-signal]
    paths:
      - scripts/build_temporal_holdout_prompts.py
      - .github/workflows/build-temporal-holdout-prompts.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/rich-persona-signal
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install numpy pandas
      - name: Build temporal holdout prompts
        run: python scripts/build_temporal_holdout_prompts.py
      - name: Persist frozen prompt set
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/research/rich_persona_signal/temporal_holdout
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Freeze temporal holdout prompts"
            git push origin HEAD:research/rich-persona-signal
          fi

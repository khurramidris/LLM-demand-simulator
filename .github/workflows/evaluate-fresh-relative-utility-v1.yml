name: evaluate-fresh-relative-utility-v1
on:
  push:
    branches: [research/fresh-relative-utility-v1]
    paths:
      - 'scripts/evaluate_fresh_relative_utility_v1.py'
      - 'outputs/research/fresh_relative_utility_v1/provider_scores.jsonl'
      - 'outputs/research/fresh_relative_utility_v1/provider_provenance.json'
      - '.github/workflows/evaluate-fresh-relative-utility-v1.yml'
jobs:
  evaluate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install analysis dependencies
        run: pip install numpy pandas scipy
      - name: Evaluate frozen provider panel
        run: PYTHONPATH=. python scripts/evaluate_fresh_relative_utility_v1.py
      - name: Show report
        run: cat outputs/research/fresh_relative_utility_v1/REPORT.md
      - name: Persist result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add outputs/research/fresh_relative_utility_v1/result.json outputs/research/fresh_relative_utility_v1/REPORT.md outputs/research/fresh_relative_utility_v1/fresh_pair_scores.csv
          git diff --cached --quiet || git commit -m 'Record fresh GPT-5.6 relative utility holdout result'
          git push

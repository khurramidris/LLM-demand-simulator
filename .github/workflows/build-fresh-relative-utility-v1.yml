name: build-fresh-relative-utility-v1
on:
  push:
    branches: [research/fresh-relative-utility-v1]
    paths:
      - 'scripts/build_fresh_relative_utility_v1.py'
      - '.github/workflows/build-fresh-relative-utility-v1.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas scikit-learn
      - name: Build blinded provider panel
        run: PYTHONPATH=. python scripts/build_fresh_relative_utility_v1.py
      - name: Persist frozen panel
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add outputs/research/fresh_relative_utility_v1/
          git diff --cached --quiet || git commit -m 'Freeze fresh relative utility provider panel'
          git push

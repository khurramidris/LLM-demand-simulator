name: Research H&M cold-start population benchmark

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "scripts/research_hm_cold_start_population.py"
      - "research/experiments/006_cold_start_population_benchmark.md"
      - ".github/workflows/research-hm-cold-start-population.yml"
      - "outputs/products/txns_trousers_online.csv.zip"
      - "outputs/personas/customer_features.csv.zip"
      - "outputs/personas/persona_cells.csv"

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy<3" "pandas<3" "scipy<2" "scikit-learn<2" "datasets>=3,<5" "pyarrow<22"

      - name: Run preregistered Stage A benchmark
        run: |
          python scripts/research_hm_cold_start_population.py \
            --output-dir research/results/006_cold_start_population

      - name: Upload benchmark artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp006-cold-start-population-results
          path: research/results/006_cold_start_population
          if-no-files-found: warn

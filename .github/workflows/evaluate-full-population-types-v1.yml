name: evaluate-full-population-types-v1
on:
  push:
    branches: [research/full-population-types-v1]
    paths:
      - 'scripts/evaluate_full_population_types_v1.py'
      - 'outputs/research/full_population_types_v1/provider_scores_*.jsonl'
      - '.github/workflows/evaluate-full-population-types-v1.yml'
jobs:
  evaluate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas scipy
      - name: Evaluate frozen population representations
        run: PYTHONPATH=. python scripts/evaluate_full_population_types_v1.py
      - name: Show report
        run: cat outputs/research/full_population_types_v1/REPORT.md
      - name: Persist result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add outputs/research/full_population_types_v1/result.json outputs/research/full_population_types_v1/REPORT.md outputs/research/full_population_types_v1/pair_scores_*.csv
          git diff --cached --quiet || git commit -m 'Record full-population representation result'
          git push

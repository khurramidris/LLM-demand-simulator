name: research-persona-necessity

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/research_persona_necessity.py"
      - "research/experiments/002_persona_necessity.md"
      - ".github/workflows/research-persona-necessity.yml"
      - "demand_sim/**"
  workflow_dispatch:

jobs:
  persona-necessity:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install minimal research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            numpy==2.2.6 \
            pandas==2.2.3 \
            scipy==1.15.3 \
            cvxpy==1.6.5

      - name: Verify committed baseline artifact
        run: |
          python - <<'PY'
          import pandas as pd
          df = pd.read_csv("outputs/demand_prediction/summary_mean_metrics_test.csv").set_index("model")
          assert abs(float(df.loc["llm-mix-cal", "zt_avg_nll"]) - 1.8346024861697727) < 1e-12
          assert abs(float(df.loc["llm-mix-cal", "mae"]) - 1.38048553572638) < 1e-12
          print(df.loc[["llm-mix-cal"], ["zt_avg_nll", "mae", "rmse"]])
          PY

      - name: Run persona necessity diagnostic
        run: |
          python scripts/research_persona_necessity.py --n-splits 10

      - name: Print result summary
        if: always()
        run: |
          if [ -f outputs/research/persona_necessity/persona_necessity_summary.csv ]; then
            cat outputs/research/persona_necessity/persona_necessity_summary.csv
          fi
          if [ -f outputs/research/persona_necessity/persona_necessity_decision.json ]; then
            cat outputs/research/persona_necessity/persona_necessity_decision.json
          fi

      - name: Upload research outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: persona-necessity-results
          path: outputs/research/persona_necessity/
          if-no-files-found: warn

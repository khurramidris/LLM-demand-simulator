name: rich-persona-signal

on:
  push:
    branches: ["research/rich-persona-signal"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install experiment dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scikit-learn

      - name: Verify committed research data
        run: |
          ls -lh outputs/personas/customer_features.csv.zip
          ls -lh outputs/products/txns_trousers_online.csv.zip
          ls -lh outputs/products/product_info_top100_online.csv
          unzip -l outputs/personas/customer_features.csv.zip | head -20
          unzip -l outputs/products/txns_trousers_online.csv.zip | head -20

      - name: Sanitize ZIP archives
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile

          pairs = [
              (Path('outputs/personas/customer_features.csv.zip'), Path('/tmp/customer_features.clean.zip')),
              (Path('outputs/products/txns_trousers_online.csv.zip'), Path('/tmp/txns_trousers_online.clean.zip')),
          ]
          for source, target in pairs:
              with ZipFile(source) as zin:
                  members = [
                      name for name in zin.namelist()
                      if name.lower().endswith('.csv') and not name.startswith('__MACOSX/') and '/._' not in name
                  ]
                  if len(members) != 1:
                      raise RuntimeError(f'{source}: expected one real CSV member, found {members}')
                  payload = zin.read(members[0])
              with ZipFile(target, 'w', compression=ZIP_DEFLATED) as zout:
                  zout.writestr(Path(members[0]).name, payload)
              print(source, '->', target, 'member=', members[0], 'bytes=', len(payload))
          PY

      - name: Run representation signal gate
        id: experiment
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p outputs/research/rich_persona_signal
          python scripts/experiment_rich_persona_signal.py \
            --customer-features /tmp/customer_features.clean.zip \
            --trouser-transactions /tmp/txns_trousers_online.clean.zip \
            --bootstrap-reps 100 \
            --bootstrap-n 50000 \
            2>&1 | tee outputs/research/rich_persona_signal/experiment.log

      - name: Show report or failure log
        if: always()
        run: |
          if [ -f outputs/research/rich_persona_signal/REPORT.md ]; then
            cat outputs/research/rich_persona_signal/REPORT.md
          elif [ -f outputs/research/rich_persona_signal/experiment.log ]; then
            cat outputs/research/rich_persona_signal/experiment.log
          fi

      - name: Persist experiment record to branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f outputs/research/rich_persona_signal
          if ! git diff --cached --quiet; then
            git commit -m "Record rich-persona signal run [skip ci]"
            git push
          fi

      - name: Upload experiment outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rich-persona-signal-results
          path: outputs/research/rich_persona_signal/
          if-no-files-found: warn

      - name: Fail workflow if experiment failed
        if: steps.experiment.outcome == 'failure'
        run: exit 1

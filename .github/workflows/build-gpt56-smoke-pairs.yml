name: build-gpt56-smoke-pairs

on:
  push:
    branches: ["research/rich-persona-signal"]
    paths:
      - "scripts/build_gpt56_smoke_pairs.py"
      - ".github/workflows/build-gpt56-smoke-pairs.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/rich-persona-signal

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install numpy pandas

      - name: Freeze paired prompts
        run: python scripts/build_gpt56_smoke_pairs.py

      - name: Persist frozen prompt set
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/research/rich_persona_signal/gpt56_smoke/prompt_pairs.jsonl \
                  outputs/research/rich_persona_signal/gpt56_smoke/manifest.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Freeze GPT-5.6 smoke prompt pairs"
            git push
          fi

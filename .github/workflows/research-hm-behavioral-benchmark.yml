name: research-hm-behavioral-benchmark

on:
  push:
    branches:
      - research/05-behavioral-benchmark
    paths:
      - 'scripts/research_hm_behavioral_benchmark.py'
      - 'research/experiments/005_behavioral_benchmark.md'
      - '.github/workflows/research-hm-behavioral-benchmark.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-and-baselines:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research dependencies
        run: python -m pip install --upgrade pip numpy pandas scipy scikit-learn
      - name: Syntax check
        run: python -m py_compile scripts/research_hm_behavioral_benchmark.py
      - name: Run preregistered Experiment 005 Stage A/B
        run: |
          python scripts/research_hm_behavioral_benchmark.py \
            --transactions outputs/products/txns_trousers_online.csv.zip \
            --output-dir /tmp/exp005_results
      - name: Upload Experiment 005 results
        uses: actions/upload-artifact@v4
        with:
          name: exp005-behavioral-benchmark-results
          path: /tmp/exp005_results
          if-no-files-found: error
          retention-days: 30
